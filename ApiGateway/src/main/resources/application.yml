server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"
      timeout: 2000ms
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: homepage-route
              uri: lb://homepage-service
              predicates:
                - Path=/home/**

            - id: autharoute
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

security:
  jwt:
    secret-key: "dGhpc2lzYXZlcnlsb25nYmFzZTY0ZW5jb2RlZHNlY3JldGtleXdpdGhhdGxlYXN0MjU2Yml0cw=="
    expiration-ms: 3600000 # 1 hour

# Rate Limiting Configuration
rate-limiting:
  enabled: true
  exclude-paths: /api/auth/login,/api/auth/register,/api/rate-limit/**

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
