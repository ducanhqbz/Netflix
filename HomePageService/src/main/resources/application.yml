server:
  port: 8082

spring:
  application:
    name: homepage-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  datasource:
    url: jdbc:mysql://localhost:3306/upload_db
    username: upload_user
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Trỏ về cổng của DiscoverService
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true # Ưu tiên dùng IP thay vì hostname để tránh lỗi mạng nội bộ
